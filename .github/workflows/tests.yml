name: Offline contracts and isolated filesystem tasks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests/ -v --junitxml=evaluation-results/unit.xml
      - run: python -m evaluations.run --mode mocked --output evaluation-results/mocked.json
      - run: python -m evaluations.run --mode filesystem --output evaluation-results/filesystem.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: evaluation-results/
